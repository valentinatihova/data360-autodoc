# Data 360 schema drift check for GitHub Actions.
#
# RUN THIS ONLY IN A PRIVATE REPOSITORY. The baseline snapshot, the uploaded
# artifact and the job summary list your org's objects and fields; in a public
# repository anyone can read them (client schema under NDA included).
#
# Copy this file to .github/workflows/data360-drift.yml in a repository that
# holds a baseline snapshot of your org. Weekly, on demand, and on pull requests
# that touch the snapshots, it signs in with the Salesforce CLI, takes a fresh
# snapshot, diffs it against the committed baseline, writes the Markdown report
# to the job summary, and FAILS the run when the org's schema has drifted, so a
# red run is your drift alert.
#
# One-time setup:
#   1. Take and commit a baseline (named by --org-name, so the file name is
#      stable):
#        data360-autodoc generate --target-org my-org --org-name prod \
#          --format json --output snapshots
#        git add snapshots/prod.json && git commit -m "Data 360 baseline"
#   2. Add repository secrets (Settings → Secrets and variables → Actions) for
#      JWT sign-in with a connected app:
#        SF_INSTANCE_URL  https://<your-domain>.my.salesforce.com
#        SF_CLIENT_ID     connected app consumer key
#        SF_USERNAME      integration user (needs read access to Data Cloud)
#        SF_PRIVATE_KEY   full text of the connected app's PEM private key
#
# Exit codes: 0 no drift, 1 drift (fails the job), 2 any error. `--strict`
# makes `generate` fail instead of writing a partial snapshot when a DMO can't
# be read, so a transient API error never shows up as "DMO removed".
#
# Accepting drift: download the "data360-drift" artifact from the failed run,
# replace snapshots/prod.json with current/prod.json, and commit it.

name: Data 360 schema drift

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "snapshots/**"

permissions:
  contents: read

jobs:
  drift:
    # Pull requests from forks get no secrets: skip instead of failing.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ORG_NAME: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data360-autodoc and the Salesforce CLI
        run: |
          pip install "data360-autodoc>=0.4.1,<0.5"
          npm install --global @salesforce/cli@2

      - name: Sign in with the Salesforce CLI (JWT)
        env:
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/server.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SF_PRIVATE_KEY" > "$key")
          sf org login jwt \
            --instance-url "$SF_INSTANCE_URL" \
            --client-id "$SF_CLIENT_ID" \
            --username "$SF_USERNAME" \
            --jwt-key-file "$key" \
            --alias ci-org > /dev/null

      - name: Take a fresh snapshot
        run: |
          data360-autodoc generate --target-org ci-org --org-name "$ORG_NAME" \
            --format json --output current --strict

      - name: Diff against the baseline
        run: |
          data360-autodoc diff "snapshots/$ORG_NAME.json" "current/$ORG_NAME.json" \
            --output drift/drift.md --fail-on-change

      - name: Publish the drift report to the job summary
        if: always()
        run: |
          if [ -f drift/drift.md ]; then
            cat drift/drift.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload snapshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data360-drift
          path: |
            current/
            drift/
          if-no-files-found: ignore
